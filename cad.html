<!DOCTYPE html>
<html lang="PT-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suas Notas</title>
    <link rel="stylesheet" href="./css/design-cad.css">
    <link rel="icon" type="img/png" href="./img/mainLogo.png">
</head>
<body>
    <header>
        <img src="./img/mainLogo.png" placeholder="Suas Notas.logo" id="notelogo">
        <div class="titleTab">
            <h1 class="title">Suas Notas</h1>
            enterprise
        </div>
    </header>
    <main>
        <div class="cadry">
            <div class="entTitle">
                <h2>Cadastrar</h2>
            </div>
            <form class="fromi">
                <label for="nome">
                    Nome <br>
                    <input name="nome" type="text" id="nomeA" placeholder="Nome do Aluno">
                </label> <br>
                <label for="email">
                    Email <br>
                    <input name="email" type="email" id="emailA" placeholder="E-mail do Aluno">
                </label>
                <div class="formLine">
                    <label for="date">
                        Data de Nascimento <br>
                        <input name="date" type="date" id="dtNasA" placeholder="Nascimento do Aluno" >
                    </label>
                    <label for="matricula">
                        Matrícula <br>
                        <input name="matricula" type="text" id="matriculaA" placeholder="Matrícula do Aluno">
                    </label>
                </div>
                <label for="senha">
                    Senha <br>
                    <input name="senha" type="password" id="senhaA" placeholder="Palavra passe">
                </label>
            </form>
            <div class="entButton">
                <button onclick="entra()" class="entButt">CADASTRAR</button>
            </div>
            <div class="altLog">
                Já tem uma conta?
                <a href="./ent.html">Entre</a>
            </div>
        </div>
    </main>
</body>
</html>
